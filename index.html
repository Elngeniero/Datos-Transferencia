<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14/assets/svg/1f4b3.svg" type="image/svg+xml">
<title>Datos de transferencia</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: #f0f0f0;
  }

  .container { width: 100%; max-width: 400px; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.07);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid #ebebeb;
  }

  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #e8f0fe;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #3b5bdb;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }

  .name { font-size: 16px; font-weight: 600; color: #1a1a1a; line-height: 1.3; }
  .bank { font-size: 13px; color: #888; margin-top: 3px; }

  .fields { display: flex; flex-direction: column; gap: 4px; }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #f0f0f0;
  }

  .field:last-child { border-bottom: none; }
  .field-info { flex: 1; min-width: 0; }

  .field-label {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }

  .field-value { font-size: 14px; font-weight: 500; color: #1a1a1a; word-break: break-all; }

  .copy-btn {
    flex-shrink: 0;
    background: #f7f7f5;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #666;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .copy-btn:hover { background: #eeeeeb; color: #1a1a1a; }
  .copy-btn:active { transform: scale(0.96); }
  .copy-btn.copied { background: #e8f5e9; color: #2e7d32; }
  .copy-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .divider { height: 1px; background: #ebebeb; margin: 20px 0 16px; }

  .copy-all-btn {
    width: 100%;
    padding: 13px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.2px;
  }

  .copy-all-btn:hover { background: #333; }
  .copy-all-btn:active { transform: scale(0.98); }
  .copy-all-btn.copied { background: #2e7d32; }
  .copy-all-btn svg { width: 15px; height: 15px; }

  .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #bbb; }

  .card { background: #1c1c1e; box-shadow: 0 2px 24px rgba(0,0,0,0.4); }
  .header { border-bottom-color: #2c2c2e; }
  .avatar { background: #1e2d5a; color: #7ba3ff; }
  .name { color: #f0f0f0; }
  .bank { color: #888; }
  .field { border-bottom-color: #2c2c2e; }
  .field-label { color: #555; }
  .field-value { color: #f0f0f0; }
  .copy-btn { background: #2c2c2e; color: #aaa; }
  .copy-btn:hover { background: #3a3a3c; color: #f0f0f0; }
  .copy-btn.copied { background: #1a3a1a; color: #66bb6a; }
  .divider { background: #2c2c2e; }
  .copy-all-btn { background: #f0f0f0; color: #1a1a1a; }
  .copy-all-btn:hover { background: #ddd; }
  .copy-all-btn.copied { background: #2e7d32; color: #fff; }
  .footer { color: #444; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header">
      <div class="avatar">CA</div>
      <div>
        <div class="name">Cristian Andrés Álvarez Miranda</div>
        <div class="bank">Mercado Pago</div>
      </div>
    </div>

    <div class="fields" id="fields"></div>

    <div class="divider"></div>

    <button class="copy-all-btn" id="copyAllBtn" onclick="copyAll()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="5" y="5" width="9" height="9" rx="1.5"/>
        <path d="M3 11V3a1 1 0 011-1h8"/>
      </svg>
      Copiar todos los datos
    </button>
  </div>
  <div class="footer">Toca cualquier campo para copiarlo</div>
</div>

<script>
const fields = [
  { label: "Nombre", value: "Cristian Andrés Álvarez Miranda" },
  { label: "RUT", value: "214659611" },
  { label: "Banco", value: "Mercado Pago" },
  { label: "Tipo de cuenta", value: "Cuenta Vista" },
  { label: "Número de cuenta", value: "1057301007" },
  { label: "Email", value: "cristianalvarezmiranda@gmail.com" },
];

const iconCopy = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3a1 1 0 011-1h8"/></svg>`;
const iconCheck = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="2,9 6,13 14,4"/></svg>`;

const container = document.getElementById('fields');

fields.forEach(f => {
  const div = document.createElement('div');
  div.className = 'field';
  div.innerHTML = `
    <div class="field-info">
      <div class="field-label">${f.label}</div>
      <div class="field-value"><span x-apple-data-detectors="false" style="color:#f0f0f0;text-decoration:none;">${f.value}</span></div>
    </div>
    <button class="copy-btn" onclick="copyField(this, '${f.value.replace(/'/g,"\\'")}')">
      ${iconCopy} Copiar
    </button>`;
  container.appendChild(div);
});

function copyField(btn, val) {
  navigator.clipboard.writeText(val).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = iconCheck + ' Copiado';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = iconCopy + ' Copiar';
    }, 2000);
  });
}

function copyAll() {
  const text = fields.map(f => f.value).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyAllBtn');
    btn.classList.add('copied');
    btn.innerHTML = iconCheck + ' ¡Copiado!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = iconCopy + ' Copiar todos los datos';
    }, 2500);
  });
}
</script>

</body>
</html>
